[project]
name = "graph-mcp"
version = "0.1.0"
description = "MCP server exposing a personal Microsoft account (Outlook.com mail, calendar, OneDrive, OneNote, To Do) to Claude via Microsoft Graph"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0.10,<5",
    "msal>=1.39.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "azure-identity>=1.25.3",
    "azure-keyvault-secrets>=4.11.2",
    "uvicorn>=0.54.0",
    "pypdf>=6.19.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0", "respx>=0.23.1", "ruff>=0.16.9"]

[project.scripts]
graph-mcp = "graph_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graph_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
