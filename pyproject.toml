[project]
name = "graph-mcp"
version = "0.1.0"
description = "MCP server exposing a personal Microsoft account (Outlook.com mail, calendar, OneDrive, OneNote, To Do) to Claude via Microsoft Graph"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0,<5",
    "msal>=1.31",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "azure-identity>=1.17",
    "azure-keyvault-secrets>=4.8",
    "uvicorn>=0.30",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.5"]

[project.scripts]
graph-mcp = "graph_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graph_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
